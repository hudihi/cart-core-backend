spring.application.name=ecommerce-backend


# 1. Database Connection Settings
spring.datasource.url=jdbc:mysql://localhost:3306/shop?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=shop
spring.datasource.password=shop
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# 2. JPA and Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update

# 3. Timezone Alignment (Crucial for Instant / Date fields)
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

