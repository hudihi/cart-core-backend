services:
  mysql:
    image: mysql
    container_name: ecommerce-database
    environment:
      MYSQL_DATABASE: ecommerce
      MYSQL_USER: username
      MYSQL_PASSWORD: password
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - backend-network

  phpmyadmin:
    image: phpmyadmin
    container_name: phpmyadmin
    restart: always
    ports:
      - "8080:80"
    environment:
      - PMA_HOST=mysql
      - PMA_PORT=3306
      - PMA_USERNAME=username
      - MYSQL_ROOT_PASSWORD=password
    depends_on:
      - mysql
    networks:
      - backend-network

  localstack:
    image: localstack/localstack:latest
    container_name: minio_storage
    ports:
      - "4566:4566"
    environment:
      SERVICES: s3
      DEBUG: 1
    volumes:
      - minio_data:/tmp/localstack
    healthcheck:
      test: ["CMD", "awslocal", "s3", "ls"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - backend-network

networks:
  backend-network:
    driver: local

volumes:
  minio_data:
  mysql_data:
