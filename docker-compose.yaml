services:
  mysql:
    image: mysql
    container_name: ecommerce-database
    environment:
      MYSQL_DATABASE: ecommerce
      MYSQL_USER: username
      MYSQL_PASSWORD: password
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - backend-network

  phpmyadmin:
    image: phpmyadmin
    container_name: phpmyadmin
    restart: always
    ports:
      - "8080:80"
    environment:
      - PMA_HOST=mysql
      - PMA_PORT=3306
      - PMA_USERNAME=shop
      - MYSQL_ROOT_PASSWORD=root
    depends_on:
      - mysql
    networks:
      - backend-network

networks:
  backend-network:
    driver: local

volumes:
  mysql_data:
